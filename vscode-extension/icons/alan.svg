<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- mint frame, echoing the Alan logo -- semi-transparent so it doesn't glare on dark themes -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#DCEFCF" fill-opacity="0.4"/>
  <!-- CRT monitor, enlarged to fill the badge -->
  <g stroke="#4E5C93" stroke-width="1.15" stroke-linejoin="round">
    <rect x="8.5" y="25" width="15" height="2.9" rx="1.3" fill="#93A6D6"/>
    <rect x="13" y="22.4" width="6" height="3.2" fill="#93A6D6"/>
    <rect x="3.5" y="4" width="25" height="19" rx="2.6" fill="#93A6D6"/>
    <rect x="6" y="6.4" width="20" height="14.2" rx="1.7" fill="#D8E184"/>
  </g>
  <!-- glow highlight on the screen -->
  <path d="M7.3 7.6 H17.5 L8.4 19.4 H7.3 Z" fill="#EAEFAE" opacity="0.75"/>
  <!-- A for Alan, larger and bolder -->
  <g fill="none" stroke="#3F4F8C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 8 L12.5 19"/>
    <path d="M16 8 L19.5 19"/>
    <path d="M13.9 15.4 H18.1"/>
  </g>
</svg>
