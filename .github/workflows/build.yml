name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # needed to attach the VSIX to a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build server jar + extension
        run: bash build.sh

      - name: Package VSIX
        run: bash vscode-extension/package-vsix.sh

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: alan-if-ide-vsix
          path: vscode-extension/*.vsix

      - name: Attach VSIX to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/*.vsix
