name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:   # "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed to attach the VSIX to a Release on tags

jobs:
  # Builds the language server once, and the platform-neutral VSIX for anyone who
  # brings their own Java (VS Code prefers a matching platform build and falls back
  # to this one).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build server jar + extension
        run: bash build.sh

      # On a tag, make sure v<X.Y.Z> matches the manifest, so the VSIX attached to
      # the release is not silently named after a stale version.
      - name: Check tag matches extension version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: vscode-extension
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $MANIFEST"
            exit 1
          fi

      - name: Package platform-neutral VSIX
        working-directory: vscode-extension
        run: npx vsce package

      # The Maven/Xtext build is the slow part, so do it once and let the platform
      # matrix reuse the jar.
      - name: Upload server jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: vscode-extension/server/alan-lsp.jar

      - name: Upload platform-neutral VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix-universal
          path: vscode-extension/*.vsix

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # The author profile rides along with the release rather than inside the
          # VSIX: its whole purpose is to be handed to someone who has nothing yet,
          # and it now installs the extension itself, so shipping it inside the
          # extension would be circular.
          files: |
            vscode-extension/*.vsix
            vscode-extension/alan-profile/alanif.code-profile

  # One VSIX per platform, each with its own trimmed Java runtime, so an author can
  # install from the marketplace without ever installing a JDK.
  #
  # All of them are linked on a single Linux runner: jlink can build an image for a
  # foreign platform given that platform's jmods, so there is no need for a runner
  # per OS (and no runner exists for some of these targets anyway).
  # The one job that runs on Windows. Nothing else here does -- the win32 VSIX is
  # cross-built on Linux -- and that is precisely how compiler diagnostics and
  # cross-file navigation stayed broken on Windows from 0.2.0 to 0.7.4: the paths a
  # Linux runner produces have no drive letter, so the code that mishandled drive
  # letters was never asked to. This starts a real server as a real process and reads
  # its diagnostics off the wire, which is the shape of test that would have caught it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No Alan compiler on the runner, and none needed: the round-trip test supplies
      # a stub, because what is under test is whether the server runs what it is told
      # to run and reports what comes back.
      - name: Run the Java tests on Windows
        run: mvn -B -ntp test

  package:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            jdk_os: linux
            jdk_arch: x64
          - target: linux-arm64
            jdk_os: linux
            jdk_arch: aarch64
          - target: darwin-x64
            jdk_os: mac
            jdk_arch: x64
          - target: darwin-arm64
            jdk_os: mac
            jdk_arch: aarch64
          - target: win32-x64
            jdk_os: windows
            jdk_arch: x64
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download server jar
        uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: vscode-extension/server

      - name: Compile the extension
        working-directory: vscode-extension
        run: npm install --no-fund --no-audit && npm run compile

      - name: Fetch ${{ matrix.jdk_os }}/${{ matrix.jdk_arch }} jmods
        run: |
          set -e
          URL="https://api.adoptium.net/v3/binary/latest/21/ga/${{ matrix.jdk_os }}/${{ matrix.jdk_arch }}/jdk/hotspot/normal/eclipse"
          mkdir -p target-jdk && cd target-jdk
          if [ "${{ matrix.jdk_os }}" = "windows" ]; then
            curl -sSL -o jdk.zip "$URL" && unzip -q jdk.zip
          else
            curl -sSL -o jdk.tar.gz "$URL" && tar xzf jdk.tar.gz
          fi
          # macOS nests jmods under Contents/Home; the others keep it at the root.
          JMODS=$(find . -maxdepth 4 -type d -name jmods | head -1)
          if [ -z "$JMODS" ]; then
            echo "::error::no jmods directory in the ${{ matrix.jdk_os }}/${{ matrix.jdk_arch }} JDK"
            exit 1
          fi
          echo "JMODS=$PWD/${JMODS#./}" >> "$GITHUB_ENV"

      - name: Link the runtime
        working-directory: vscode-extension
        run: ./build-jre.sh --jmods "$JMODS"

      - name: Package ${{ matrix.target }} VSIX
        working-directory: vscode-extension
        run: npx vsce package --target ${{ matrix.target }}

      - name: Upload ${{ matrix.target }} VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-extension/*.vsix

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: vscode-extension/*.vsix

  # Publish to Open VSX. TAGS ONLY -- a push to main must never reach the registry,
  # and a published version cannot be edited or replaced, only superseded.
  #
  # A separate job rather than a step in each of the others, because ordering
  # matters: it waits for all six VSIXes to exist, then publishes them in one place,
  # platform builds before the universal one. Publishing from inside the matrix
  # would race, and could leave a half-published release with no single report of
  # what actually landed.
  publish:
    # windows is in here deliberately: a release that breaks Windows should not reach
    # a registry, and until 0.7.4 nothing in CI could have told us that it had.
    needs: [build, package, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # publish.sh retries each file with backoff, so a registry outage could otherwise
    # hold a runner for half an hour. If it does time out, nothing is lost: the
    # release assets are already attached, and re-running the job skips whatever
    # already landed.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Use the artifacts the build already produced rather than re-downloading the
      # release: same bytes, and no dependency on the release existing yet.
      - name: Collect every VSIX
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vscode-extension

      # So `npx ovsx` runs the version pinned in package.json instead of resolving
      # whatever is newest on npm at release time.
      - name: Install the publishing tools
        working-directory: vscode-extension
        run: npm install --no-fund --no-audit

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: ./publish.sh

      # Separate step, and always(): a failure at one registry must not decide whether
      # the extension reaches the other. They fail independently in practice -- Open VSX
      # had a day-long outage during 0.4.0, and the Marketplace token carries both an
      # expiry and a scope deprecation (2026-12-01).
      - name: Publish to the Microsoft Marketplace
        if: always()
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          # One call: --packagePath takes several VSIXes, and each already carries its
          # own TargetPlatform, so --target would be saying again what the file says.
          # Platform builds first and the universal one last, as publish.sh does -- if
          # this dies partway, the targeted builds are the ones authors install.
          npx vsce publish --packagePath \
            "alan-if-ide-linux-x64-$VERSION.vsix" \
            "alan-if-ide-linux-arm64-$VERSION.vsix" \
            "alan-if-ide-darwin-arm64-$VERSION.vsix" \
            "alan-if-ide-darwin-x64-$VERSION.vsix" \
            "alan-if-ide-win32-x64-$VERSION.vsix" \
            "alan-if-ide-$VERSION.vsix"
