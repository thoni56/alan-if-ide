name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # needed to attach the VSIX to a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build server jar + extension
        run: bash build.sh

      # On a tag, make sure v<X.Y.Z> matches the manifest, so the VSIX attached to
      # the release is not silently named after a stale version.
      - name: Check tag matches extension version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: vscode-extension
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $MANIFEST"
            exit 1
          fi

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: alan-if-ide-vsix
          path: vscode-extension/*.vsix

      - name: Attach VSIX to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/*.vsix
