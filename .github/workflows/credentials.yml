name: credentials

# Run by hand, from the Actions tab. Publishing credentials expire quietly: the
# Marketplace PAT lasts at most a year, and Microsoft retires the "all accessible
# organizations" scope that vsce needs on 2026-12-01. Both failures would otherwise
# surface as a red release job at the worst possible moment, so this makes it possible
# to ask the question at a calm one.
on:
  workflow_dispatch:

jobs:
  verify:
    name: verify publishing credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the publishing tools
        working-directory: vscode-extension
        run: npm install --no-fund --no-audit

      - name: Open VSX
        working-directory: vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx verify-pat alanif

      # always(), so a failure above does not hide the state of the other one.
      - name: Microsoft Marketplace
        if: always()
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce verify-pat alanif
